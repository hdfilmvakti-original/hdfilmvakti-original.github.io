        :root {
            --bg-color: #000000;
            --card-bg: #141414;
            --card-hover: #1f1f1f;
            --primary-red: #e50914;
            --primary-red-hover: #ff1e27;
            --text-color: #ffffff;
            --text-muted: #aaaaaa;
            --border-color: #262626;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
            overflow-x: hidden;
        }

        /* --- ÜST GEZİNTİ ÇUBUĞU (NAVBAR) --- */
        header {
            background-color: rgba(0, 0, 0, 0.95);
            position: sticky;
            top: 0;
            z-index: 1000;
            border-bottom: 2px solid var(--primary-red);
            padding: 15px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 20px rgba(229, 9, 20, 0.2);
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1.8rem;
            font-weight: 800;
            color: var(--primary-red);
            text-decoration: none;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .logo i {
            font-size: 2rem;
        }

        .search-container {
            position: relative;
            width: 300px;
            max-width: 100%;
        }

        .search-container input {
            width: 100%;
            padding: 10px 40px 10px 15px;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            color: #fff;
            outline: none;
            transition: all 0.3s ease;
        }

        .search-container input:focus {
            border-color: var(--primary-red);
            box-shadow: 0 0 8px rgba(229, 9, 20, 0.5);
        }

        .search-container i {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
        }

        /* --- ANA İÇERİK DÜZENİ --- */
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 25px 20px;
        }

        /* --- REKLAM ALANLARI STİLİ --- */
        .ad-banner-top {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
            margin-bottom: 25px;
        }

        .native-banner-wrap {
            margin: 30px 0;
            display: flex;
            justify-content: center;
        }

        /* --- YORUM AÇ/KAPA BUTONU --- */
        .comment-toggle-btn {
            background-color: var(--primary-red);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: background-color 0.3s ease;
        }

        .comment-toggle-btn:hover {
            background-color: var(--primary-red-hover);
        }

        .custom-embed-wrap {
            margin-bottom: 20px;
            width: 100%;
            border-radius: 8px;
            overflow: hidden;
            display: none;
        }

        /* --- KAYNAK (PART/SERVER) SEÇİM BUTONLARI --- */
        .sources-bar {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 15px;
            background: #0a0a0a;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }

        .source-btn {
            background-color: #222;
            color: #aaa;
            border: 1px solid var(--border-color);
            padding: 8px 16px;
            border-radius: 6px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .source-btn:hover {
            background-color: #333;
            color: #fff;
        }

        .source-btn.active {
            background-color: var(--primary-red);
            color: #fff;
            border-color: var(--primary-red-hover);
            box-shadow: 0 0 10px rgba(229, 9, 20, 0.4);
        }

        /* --- VİDEO OYNATICI BÖLÜMÜ --- */
        .player-section {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 40px;
            border: 1px solid var(--border-color);
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.8);
        }

        .iframe-container {
            position: relative;
            width: 100%;
            padding-bottom: 56.25%;
            height: 0;
            background-color: #050505;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid #222;
        }

        .iframe-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }

        .movie-info {
            margin-top: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .movie-title-wrap {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        .movie-title {
            font-size: 1.8rem;
            color: #fff;
            font-weight: 700;
        }

        .movie-badge {
            background-color: var(--primary-red);
            color: #fff;
            padding: 4px 12px;
            border-radius: 4px;
            font-size: 0.85rem;
            font-weight: bold;
        }

        .movie-description {
            color: var(--text-muted);
            font-size: 1rem;
            max-width: 900px;
        }

        /* --- FILM IZGARASI (GRID) --- */
        .section-title {
            font-size: 1.5rem;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            border-left: 4px solid var(--primary-red);
            padding-left: 12px;
        }

        .movies-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
        }

        .movie-card {
            background-color: var(--card-bg);
            border-radius: 8px;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.3s ease, box-shadow 0.3s ease, border-color 0.3s ease;
            border: 1px solid var(--border-color);
            position: relative;
            display: flex;
            flex-direction: column;
        }

        .movie-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 10px 25px rgba(229, 9, 20, 0.4);
            border-color: var(--primary-red);
        }

        .poster-wrapper {
            position: relative;
            width: 100%;
            height: 280px;
            overflow: hidden;
            background-color: #080808;
        }

        .poster-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
        }

        .movie-card:hover .poster-wrapper img {
            transform: scale(1.08);
        }

        .play-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .play-overlay i {
            font-size: 3rem;
            color: var(--primary-red);
            filter: drop-shadow(0 0 10px rgba(0,0,0,0.8));
        }

        .movie-card:hover .play-overlay {
            opacity: 1;
        }

        .card-details {
            padding: 15px;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .card-title {
            font-size: 1.05rem;
            font-weight: 600;
            margin-bottom: 5px;
            color: #fff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .card-meta {
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .rating {
            color: #ffc107;
            font-weight: bold;
        }

        /* --- RESPONSIVE TASARIM --- */
        @media (max-width: 768px) {
            header {
                flex-direction: column;
                gap: 15px;
            }

            .search-container {
                width: 100%;
            }

            .movies-grid {
                grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
                gap: 12px;
            }

            .poster-wrapper {
                height: 200px;
            }
        }
    </style>
</head>

        function toggleComments() {
            const section = document.getElementById('commentSection');
            const btnText = document.getElementById('commentBtnText');
            if (section.style.display === 'block') {
                section.style.display = 'none';
                btnText.innerText = 'Yorumları Aç';
            } else {
                section.style.display = 'block';
                btnText.innerText = 'Yorumları Kapat';
            }
        }

        function loadMovies(movieList) {
            const grid = document.getElementById('moviesGrid');
            grid.innerHTML = '';

            if(movieList.length === 0) {
                grid.innerHTML = '<p style="color:var(--text-muted);">Aramanıza uygun film bulunamadı.</p>';
                return;
            }

            movieList.forEach(movie => {
                const card = document.createElement('div');
                card.className = 'movie-card';
                card.onclick = () => selectMovie(movie);

                card.innerHTML = `
                    <div class="poster-wrapper">
                        <img src="${movie.poster}" alt="${movie.title}" onerror="this.src='https://placehold.co/400x600/141414/e50914?text=Poster+Yok'">
                        <div class="play-overlay">
                            <i class="fa-solid fa-circle-play"></i>
                        </div>
                    </div>
                    <div class="card-details">
                        <div class="card-title">${movie.title}</div>
                        <div class="card-meta">
                            <span>${movie.year}</span>
                            <span class="rating"><i class="fa-solid fa-star"></i> ${movie.rating}</span>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function selectMovie(movie) {
            // %25 ihtimalle Smartlink aç
            if (Math.random() < 0.25) {
                window.open(SMARTLINK_URL, '_blank');
            }

            document.getElementById('currentTitle').innerText = movie.title;
            document.getElementById('currentDesc').innerText = movie.description;
            document.getElementById('currentRating').innerHTML = `<i class="fa-solid fa-star"></i> ${movie.rating}`;
            
            // Kaynak butonlarını oluştur
            buildSourcesBar(movie.sources);

            document.getElementById('player').scrollIntoView({ behavior: 'smooth' });
        }

        function buildSourcesBar(sources) {
            const bar = document.getElementById('sourcesBar');
            bar.innerHTML = '';

            if (!sources || sources.length === 0) {
                bar.style.display = 'none';
                return;
            }

            bar.style.display = 'flex';

            sources.forEach((source, index) => {
                const btn = document.createElement('button');
                btn.className = 'source-btn';
                btn.innerHTML = `<i class="fa-solid fa-server"></i> ${source.name}`;
                
                if (index === 0) {
                    btn.classList.add('active');
                    document.getElementById('mainPlayer').src = source.url;
                }

                btn.onclick = () => {
                    document.querySelectorAll('.source-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    document.getElementById('mainPlayer').src = source.url;
                };

                bar.appendChild(btn);
            });
        }

        function filterMovies() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const filtered = movies.filter(movie => 
                movie.title.toLowerCase().includes(query)
            );
            loadMovies(filtered);
        }

        // Sayfa açıldığında ilk filmi otomatik yükle ve kaynaklarını getir
        loadMovies(movies);
        if (movies.length > 0) {
            selectMovie(movies[0]);
        }

        // PWA Service Worker Kaydı
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then(reg => console.log('Service Worker kaydedildi:', reg.scope))
                    .catch(err => console.log('Service Worker hatası:', err));
            });
        }
    </script>
