<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>İnanılmaz Dijital Sirk İzle - HdFilmVakti</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, Helvetica, sans-serif;
        }
        body {
            background-color: #000000;
            color: #e0e0e0;
            padding: 15px;
        }
        .container {
            max-width: 1100px;
            margin: 0 auto;
        }
        /* Üst Bar ve Geri Dön Butonu */
        .top-bar {
            background-color: #111111;
            border: 1px solid #222222;
            padding: 10px 15px;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
        }
        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background-color: #1c1c1c;
            color: #ffffff;
            text-decoration: none;
            padding: 8px 14px;
            border: 1px solid #333333;
            font-size: 14px;
            font-weight: bold;
        }
        .back-btn:hover {
            background-color: #ff9800;
            color: #000000;
            border-color: #ff9800;
        }
        /* Ana Düzen */
        .main-layout {
            display: flex;
            gap: 20px;
            align-items: flex-start;
        }
        .left-column {
            flex: 1;
            min-width: 0;
        }
        .right-column {
            width: 260px;
            flex-shrink: 0;
        }
        /* Dizi Başlık Alanı */
        .movie-header {
            background-color: #111111;
            border: 1px solid #222222;
            padding: 12px 15px;
            margin-bottom: 10px;
        }
        .movie-titles h1 {
            font-size: 18px;
            color: #ffffff;
            margin-bottom: 3px;
        }
        .movie-titles span {
            font-size: 13px;
            color: #ff9800;
            font-weight: bold;
        }
        /* Alternatifler Açılır Menü Çubuğu */
        .controls-bar {
            background-color: #111111;
            border: 1px solid #222222;
            padding: 8px 15px;
            margin-bottom: 10px;
            position: relative;
        }
        .alt-dropdown {
            position: relative;
            display: inline-block;
        }
        .alt-btn {
            background-color: #1c1c1c;
            color: #e0e0e0;
            border: 1px solid #333333;
            padding: 7px 14px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .alt-btn:hover {
            background-color: #252525;
            color: #ffffff;
        }
        .alt-menu {
            display: none;
            position: absolute;
            top: 100%;
            left: 0;
            background-color: #16181c;
            border: 1px solid #2c3038;
            min-width: 210px;
            z-index: 99;
            margin-top: 2px;
        }
        .alt-menu.show {
            display: block;
        }
        .alt-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 14px;
            color: #e0e0e0;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            border-bottom: 1px solid #22252b;
        }
        .alt-item:last-child {
            border-bottom: none;
        }
        .alt-item:hover, .alt-item.active {
            background-color: #252830;
            color: #ff9800;
        }
        .alt-quality {
            font-size: 11px;
            color: #aaaaaa;
        }
        /* Video Player Kutusu */
        .player-wrapper {
            position: relative;
            width: 100%;
            padding-top: 56.25%;
            background-color: #050505;
            border: 1px solid #222222;
            margin-bottom: 10px;
        }
        .player-wrapper iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }
        /* Önceki / Sonraki Bölüm Tuşları */
        .episode-nav {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            margin-bottom: 15px;
        }
        .nav-btn {
            flex: 1;
            background-color: #111111;
            color: #ffffff;
            border: 1px solid #333333;
            padding: 10px 15px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            text-align: center;
        }
        .nav-btn:hover:not(:disabled) {
            background-color: #ff9800;
            color: #000000;
            border-color: #ff9800;
        }
        .nav-btn:disabled {
            opacity: 0.35;
            cursor: not-allowed;
        }
        /* Yorumlar Kutusu */
        .box-section {
            background-color: #111111;
            border: 1px solid #222222;
            padding: 15px;
            margin-bottom: 15px;
        }
        .box-title {
            font-size: 14px;
            font-weight: bold;
            color: #ffffff;
            margin-bottom: 8px;
            border-bottom: 1px solid #222222;
            padding-bottom: 6px;
        }
        /* Sağ Taraf Bölüm Seç Butonu ve Afiş */
        .select-ep-btn {
            width: 100%;
            background-color: #ff9800;
            color: #000000;
            border: none;
            padding: 12px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .select-ep-btn:hover {
            background-color: #e68900;
        }
        .poster-box {
            background-color: #111111;
            border: 1px solid #222222;
            padding: 8px;
        }
        .poster-box img {
            width: 100%;
            height: auto;
            display: block;
        }
        /* Kapanabilir Sezon ve Bölüm Seçim Alanı (Modal) */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.85);
            z-index: 999;
            justify-content: center;
            align-items: center;
            padding: 15px;
        }
        .modal-overlay.show {
            display: flex;
        }
        .modal-content {
            background-color: #111111;
            border: 1px solid #333333;
            width: 100%;
            max-width: 550px;
            max-height: 80vh;
            display: flex;
            flex-direction: column;
        }
        .modal-header {
            padding: 12px 15px;
            border-bottom: 1px solid #222222;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #161616;
        }
        .modal-header h3 {
            font-size: 15px;
            color: #ffffff;
        }
        .close-modal {
            background: none;
            border: none;
            color: #aaaaaa;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
        }
        .close-modal:hover {
            color: #ff9800;
        }
        .modal-body {
            padding: 15px;
            overflow-y: auto;
        }
        /* Sezon Akordeon Listesi */
        .season-item {
            border: 1px solid #222222;
            margin-bottom: 8px;
            background-color: #161616;
        }
        .season-header {
            padding: 11px 14px;
            font-size: 14px;
            font-weight: bold;
            color: #ffffff;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .season-header:hover {
            background-color: #1f1f1f;
            color: #ff9800;
        }
        .episode-list {
            display: none;
            border-top: 1px solid #222222;
            background-color: #0d0d0d;
            padding: 8px;
        }
        .episode-list.open {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
            gap: 6px;
        }
        .ep-btn {
            background-color: #1a1a1a;
            color: #e0e0e0;
            border: 1px solid #2a2a2a;
            padding: 8px 6px;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
            text-align: center;
        }
        .ep-btn:hover {
            background-color: #252525;
            border-color: #ff9800;
        }
        .ep-btn.active {
            background-color: #ff9800;
            color: #000000;
            border-color: #ff9800;
        }
        /* Mobil Uyum */
        @media (max-width: 768px) {
            .main-layout {
                flex-direction: column;
            }
            .right-column {
                width: 100%;
                max-width: 300px;
                margin: 0 auto;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <!-- Üst Geri Dönüş Çubuğu -->
    <div class="top-bar">
        <a href="https://hdfilmvakti-original.github.io/filmler.html" class="back-btn">
            &#8592; Filmlere Dön
        </a>
    </div>

    <div class="main-layout">
        <!-- Sol Kolon -->
        <div class="left-column">
            <!-- Başlık -->
            <div class="movie-header">
                <div class="movie-titles">
                    <h1 id="seriesTitle">İnanılmaz Dijital Sirk</h1>
                    <span id="currentEpTitle">1. Sezon - 1. Bölüm</span>
                </div>
            </div>

            <!-- Alternatifler Butonu ve Açılır Menü -->
            <div class="controls-bar">
                <div class="alt-dropdown">
                    <button class="alt-btn" id="altDropdownBtn" onclick="toggleAltMenu()">
                        &#9654; Alternatifler &#9662;
                    </button>
                    <div class="alt-menu" id="altMenu"></div>
                </div>
            </div>

            <!-- Video Player Alanı -->
            <div class="player-wrapper">
                <iframe id="videoPlayer" src="" allowfullscreen></iframe>
            </div>

            <!-- Önceki ve Sonraki Bölüm Tuşları -->
            <div class="episode-nav">
                <button class="nav-btn" id="prevEpBtn" onclick="changeEpisodeStep(-1)">&#8592; Önceki Bölüm</button>
                <button class="nav-btn" id="nextEpBtn" onclick="changeEpisodeStep(1)">Sonraki Bölüm &#8594;</button>
            </div>

            <!-- Yorumlar Bölümü -->
            <div class="box-section">
                <div class="box-title">Yorumlar</div>
                <div id="comments-area"></div>
            </div>
        </div>

        <!-- Sağ Kolon (Bölüm Seç Butonu ve Afiş) -->
        <div class="right-column">
            <button class="select-ep-btn" onclick="openEpisodeModal()">
                &#9776; Bölüm Seç
            </button>
            <div class="poster-box">
                <img id="seriesPoster" src="https://external-content.duckduckgo.com/iu/?u=https%3A%2F%2Ftse4.mm.bing.net%2Fth%2Fid%2FOIP.xEhuwEpc9AEzqqFWVEkw9gHaLH%3Fr%3D0%26pid%3DApi&f=1&ipt=f9e8a219d53f2f8c974ed79f77170fc5e805346e96abc07bd755dfdd778b2479&ipo=images" alt="İnanılmaz Dijital Sirk Afişi">
            </div>
        </div>
    </div>
</div>

<!-- Sezon ve Bölüm Seçim Modalı -->
<div class="modal-overlay" id="episodeModal" onclick="closeModalOutside(event)">
    <div class="modal-content">
        <div class="modal-header">
            <h3>Sezon ve Bölüm Seçin</h3>
            <button class="close-modal" onclick="closeEpisodeModal()">&times;</button>
        </div>
        <div class="modal-body" id="seasonsContainer">
            <!-- Sezonlar JS ile buraya eklenecek -->
        </div>
    </div>
</div>

<script>
    const diziVerisi = {
        ad: "İnanılmaz Dijital Sirk",
        afis: "https://external-content.duckduckgo.com/iu/?u=https%3A%2F%2Ftse4.mm.bing.net%2Fth%2Fid%2FOIP.xEhuwEpc9AEzqqFWVEkw9gHaLH%3Fr%3D0%26pid%3DApi&f=1&ipt=f9e8a219d53f2f8c974ed79f77170fc5e805346e96abc07bd755dfdd778b2479&ipo=images",
        sezonlar: [
            {
                sezonAdi: "1. Sezon",
                bolumler: [
                    {
                        bolumAdi: "1. Bölüm",
                        kaynaklar: [
                            { ad: "Archive", kalite: "1080p", url: "https://embedhubvakti.lovable.app/e/713aa1df3d" },
                            { ad: "VidMoly", kalite: "1080p", url: "https://vidmoly.org/embed-26xx4pvkabks.html" },
                            { ad: "VidCherry", kalite: "1080p", url: "https://vidcherry.lovable.app/embed/0bb073eb-00d3-418a-a6c4-9ad0505f344a" }
                        ],
                        yorumKodu: `<iframe src="https://horizoncomments.lovable.app/embed/f10f1576-35dc-47b1-ab78-56d99d29caf6" style="width:100%;height:640px;border:0;color-scheme:dark" loading="lazy" title="Comments"></iframe>`
                    },
                    {
                        bolumAdi: "2. Bölüm",
                        kaynaklar: [
                            { ad: "VidCherry", kalite: "1080p", url: "https://vidcherry.lovable.app/embed/2ee1b7c5-a0ea-43eb-9af1-ac532f0201e0" },
                            { ad: "Archive", kalite: "1080p", url: "https://embedhubvakti.lovable.app/e/c1c7488258" }
                        ],
                        yorumKodu: `<iframe src="https://horizoncomments.lovable.app/embed/8d14a215-e042-4715-b205-c1df0b6ea0e5" style="width:100%;height:640px;border:0;color-scheme:dark" loading="lazy" title="Comments"></iframe>`
                    },
                    {
                        bolumAdi: "3. Bölüm",
                        kaynaklar: [
                            { ad: "VidCherry", kalite: "1080p", url: "https://vidcherry.lovable.app/embed/7a0891f9-c730-40f4-a92e-a81bbcf2cda8" }
                        ],
                        yorumKodu: `<iframe src="https://horizoncomments.lovable.app/embed/250d4600-542a-4182-8bd8-c2f6e6e8e84a" style="width:100%;height:640px;border:0;color-scheme:dark" loading="lazy" title="Comments"></iframe>`
                    },
                    {
                        bolumAdi: "4. Bölüm",
                        kaynaklar: [
                            { ad: "VidCherry", kalite: "1080p", url: "https://vidcherry.lovable.app/embed/4cf4e838-4495-4cc9-a506-2b310a70dfab" }
                        ],
                        yorumKodu: `<iframe src="https://horizoncomments.lovable.app/embed/2f843da2-fa90-4e03-a17e-4c5f9379cc7e" style="width:100%;height:640px;border:0;color-scheme:dark" loading="lazy" title="Comments"></iframe>`
                    },
                    {
                        bolumAdi: "5. Bölüm",
                        kaynaklar: [
                            { ad: "VidCherry", kalite: "1080p", url: "https://vidcherry.lovable.app/embed/5e05a33b-556c-42b9-b859-1cc2e517f70f" }
                        ],
                        yorumKodu: `<iframe src="https://horizoncomments.lovable.app/embed/177462b9-4ed2-4c2d-9a0a-4e5af94f3c8b" style="width:100%;height:640px;border:0;color-scheme:dark" loading="lazy" title="Comments"></iframe>`
                    },
                    {
                        bolumAdi: "6. Bölüm",
                        kaynaklar: [
                            { ad: "Vidcherry", kalite: "1080p", url: "https://vidcherry.lovable.app/embed/97fad75d-9ee4-4d78-9ed9-3fb8d9125f06" }
                        ],
                        yorumKodu: `<iframe src="https://horizoncomments.lovable.app/embed/cfaf79d3-aa4a-43ce-8e57-5a35a15b1ae6" style="width:100%;height:640px;border:0;color-scheme:dark" loading="lazy" title="Comments"></iframe>`
                    },
                    {
                        bolumAdi: "7. Bölüm",
                        kaynaklar: [
                            { ad: "Vidcherry", kalite: "1080p", url: "https://vidcherry.lovable.app/embed/93f58f5d-2022-49ed-87ef-1d5969b2b293" }
                        ],
                        yorumKodu: `<iframe src="https://horizoncomments.lovable.app/embed/cfaf79d3-aa4a-43ce-8e57-5a35a15b1ae6" style="width:100%;height:640px;border:0;color-scheme:dark" loading="lazy" title="Comments"></iframe>`
                    },
                    {
                        bolumAdi: "8. Bölüm",
                        kaynaklar: [
                            { ad: "Vidcherry", kalite: "1080p", url: "https://vidcherry.lovable.app/embed/5f7e8bcf-4831-47de-a0f3-bdc9d4a4b863" }
                        ],
                        yorumKodu: `<iframe src="https://horizoncomments.lovable.app/embed/c0766766-1f8e-412d-95de-4baffdf0858d" style="width:100%;height:640px;border:0;color-scheme:dark" loading="lazy" title="Comments"></iframe>`
                    },
                    {
                        bolumAdi: "9. Bölüm",
                        kaynaklar: [
                            { ad: "Vidcherry", kalite: "1080p", url: "https://vidcherry.lovable.app/embed/1f4945ef-4f6f-471f-a1e9-196e5dac4c37" }
                        ],
                        yorumKodu: `<iframe src="https://horizoncomments.lovable.app/embed/2701dbc3-fa0f-41da-8069-46cede0420b7" style="width:100%;height:640px;border:0;color-scheme:dark" loading="lazy" title="Comments"></iframe>`
                    }
                ]
            }
        ]
    };

    let aktifSezonIndex = 0;
    let aktifBolumIndex = 0;

    function initPage() {
        document.getElementById("seriesTitle").textContent = diziVerisi.ad;
        document.getElementById("seriesPoster").src = diziVerisi.afis;
        buildSeasonsModal();
        loadEpisode(0, 0);
    }

    function buildSeasonsModal() {
        const container = document.getElementById("seasonsContainer");
        container.innerHTML = "";

        diziVerisi.sezonlar.forEach((sezon, sIdx) => {
            const seasonDiv = document.createElement("div");
            seasonDiv.className = "season-item";

            const header = document.createElement("div");
            header.className = "season-header";
            header.innerHTML = `<span>${sezon.sezonAdi}</span><span>&#9662;</span>`;
            header.onclick = () => {
                const epList = seasonDiv.querySelector(".episode-list");
                epList.classList.toggle("open");
            };

            const epList = document.createElement("div");
            epList.className = "episode-list" + (sIdx === aktifSezonIndex ? " open" : "");

            sezon.bolumler.forEach((bolum, bIdx) => {
                const btn = document.createElement("button");
                btn.className = "ep-btn";
                btn.dataset.sIdx = sIdx;
                btn.dataset.bIdx = bIdx;
                btn.textContent = bolum.bolumAdi;
                btn.onclick = () => {
                    loadEpisode(sIdx, bIdx);
                    closeEpisodeModal();
                };
                epList.appendChild(btn);
            });

            seasonDiv.appendChild(header);
            seasonDiv.appendChild(epList);
            container.appendChild(seasonDiv);
        });
    }

    function loadEpisode(sIdx, bIdx) {
        aktifSezonIndex = sIdx;
        aktifBolumIndex = bIdx;

        const sezon = diziVerisi.sezonlar[sIdx];
        const bolum = sezon.bolumler[bIdx];

        document.getElementById("currentEpTitle").textContent = `${sezon.sezonAdi} - ${bolum.bolumAdi}`;

        const altMenu = document.getElementById("altMenu");
        altMenu.innerHTML = "";
        document.getElementById("altDropdownBtn").innerHTML = `&#9654; Alternatifler (${bolum.kaynaklar.length}) &#9662;`;

        bolum.kaynaklar.forEach((kaynak, kIdx) => {
            const item = document.createElement("div");
            item.className = "alt-item" + (kIdx === 0 ? " active" : "");
            item.innerHTML = `<span>${kaynak.ad}</span><span class="alt-quality">${kaynak.kalite || ''}</span>`;
            item.onclick = () => changeSource(kaynak.url, item);
            altMenu.appendChild(item);
        });

        if (bolum.kaynaklar.length > 0 && bolum.kaynaklar[0].url) {
            document.getElementById("videoPlayer").src = bolum.kaynaklar[0].url;
        } else {
            document.getElementById("videoPlayer").src = "";
        }

        const commentsArea = document.getElementById("comments-area");
        commentsArea.innerHTML = bolum.yorumKodu || "";
        Array.from(commentsArea.querySelectorAll("script")).forEach(oldScript => {
            const newScript = document.createElement("script");
            Array.from(oldScript.attributes).forEach(attr => newScript.setAttribute(attr.name, attr.value));
            newScript.appendChild(document.createTextNode(oldScript.innerHTML));
            oldScript.parentNode.replaceChild(newScript, oldScript);
        });

        document.querySelectorAll(".ep-btn").forEach(btn => {
            btn.classList.toggle("active", Number(btn.dataset.sIdx) === sIdx && Number(btn.dataset.bIdx) === bIdx);
        });

        const isFirst = (sIdx === 0 && bIdx === 0);
        const lastSIdx = diziVerisi.sezonlar.length - 1;
        const lastBIdx = diziVerisi.sezonlar[lastSIdx].bolumler.length - 1;
        const isLast = (sIdx === lastSIdx && bIdx === lastBIdx);

        document.getElementById("prevEpBtn").disabled = isFirst;
        document.getElementById("nextEpBtn").disabled = isLast;
    }

    function changeEpisodeStep(step) {
        let sIdx = aktifSezonIndex;
        let bIdx = aktifBolumIndex + step;

        if (bIdx < 0) {
            if (sIdx > 0) {
                sIdx--;
                bIdx = diziVerisi.sezonlar[sIdx].bolumler.length - 1;
            } else {
                return;
            }
        } else if (bIdx >= diziVerisi.sezonlar[sIdx].bolumler.length) {
            if (sIdx < diziVerisi.sezonlar.length - 1) {
                sIdx++;
                bIdx = 0;
            } else {
                return;
            }
        }

        loadEpisode(sIdx, bIdx);
    }

    function toggleAltMenu() {
        document.getElementById("altMenu").classList.toggle("show");
    }

    function changeSource(url, element) {
        document.getElementById("videoPlayer").src = url;
        document.querySelectorAll(".alt-item").forEach(item => item.classList.remove("active"));
        element.classList.add("active");
        document.getElementById("altMenu").classList.remove("show");
    }

    function openEpisodeModal() {
        document.getElementById("episodeModal").classList.add("show");
    }

    function closeEpisodeModal() {
        document.getElementById("episodeModal").classList.remove("show");
    }

    function closeModalOutside(event) {
        if (event.target.id === "episodeModal") {
            closeEpisodeModal();
        }
    }

    window.onclick = function(event) {
        if (!event.target.closest('.alt-dropdown')) {
            const dropdown = document.getElementById("altMenu");
            if (dropdown.classList.contains('show')) {
                dropdown.classList.remove('show');
            }
        }
    }

    initPage();
</script>

</body>
</html>
